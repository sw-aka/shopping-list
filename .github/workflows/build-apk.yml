name: Android build check

# Check changes on main and allow manual checks before merging.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Debug signing keeps this check independent of signing credentials.
      - name: Build release APK
        run: flutter build apk --release

      # AndroidX adds an app-specific receiver permission; reject android.permission.* requests.
      - name: Check APK requests no system permissions
        run: |
          SDK_BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          AAPT="$ANDROID_HOME/build-tools/$SDK_BUILD_TOOLS/aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
          if "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk \
              | grep "uses-permission" | grep -q "android.permission."; then
            echo "::error::Release APK requests system permissions but should request none (especially not INTERNET)."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopping-list-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
